module:
  id: JAVA-SILVER-04
  title: 例外処理
  level: silver
  description: "例外階層、処理・伝播戦略、リソース解放パターンを理解し実務で活用する。"
  outcomes:
    - "checked/unchecked例外を区分し、処理・宣言戦略を選択できる。"
    - "例外変換時に原因(cause)と意味を保存できる。"
    - "try-with-resourcesでリソースを安全に解放できる。"
  lessons:
    - id: JAVA-SILVER-04-01
      title: Checked vs Unchecked / throws vs try-catch
      est_minutes: 35
      tags: [exceptions, checked, unchecked, throws, try-catch]
      outcomes:
        - "checked/unchecked差異を定義と例示で説明する。"
        - "throwsとtry-catchの選択基準を説明する。"
    - id: JAVA-SILVER-04-02
      title: "例外変換(wrap)とcause保存"
      est_minutes: 35
      tags: [exceptions, wrap, cause]
      outcomes:
        - "ドメイン例外に変換する際にcauseを保存する。"
    - id: JAVA-SILVER-04-03
      title: "try-with-resourcesとAutoCloseable"
      est_minutes: 30
      tags: [exceptions, resources, autocloseable]
      outcomes:
        - "try-with-resourcesがclose呼び出しを保証する理由を説明する。"
