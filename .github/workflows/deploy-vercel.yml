name: Deploy J-Bridge-local to Vercel

# J-Bridge-local 전용 배포 워크플로.
# main push 시 Vercel(j-bridge-local) 로 프로덕션 배포한다.
# repository 가드가 있어 다른 레포(test/honban)로 코드가 흘러가도 동작하지 않는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'taehun0023/J-Bridge-local'
    runs-on: ubuntu-latest
    # Vercel CLI 가 "Building…" 에서 무한 대기하면 GitHub Actions 기본 한도(6h)까지 점유한다.
    # 15분 내 끝나지 않으면 실패 처리해 큐 점유·비용 낭비를 막는다.
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
