# =============================================================================
# J-Bridge — Synology NAS 배포용 Compose 파일
# =============================================================================
# 사용 위치 (NAS):  /volume1/docker/j-bridge/docker-compose.yml
# 필요한 파일    :  .env.production  (chmod 600, 같은 폴더)
#
# 명령어:
#   docker compose build          # 이미지 빌드
#   docker compose up -d          # 백그라운드 실행
#   docker compose logs -f web    # 로그 확인
#   docker compose restart web    # 재시작
#   docker compose down           # 정지 + 컨테이너 제거 (볼륨은 유지)
#
# 업데이트(코드 변경 후):
#   git pull && docker compose up -d --build
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # 빌드 시점에 클라이언트 번들로 inline 되는 PUBLIC 변수만 args 로 전달.
      # service_role_key 같은 비밀은 절대 args 로 넣지 말 것 (이미지에 박힘).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: j-bridge:latest
    container_name: j-bridge-web
    restart: unless-stopped

    # 런타임 비밀(service_role_key 등)은 env_file 로만 주입
    env_file:
      - .env.production

    ports:
      # 호스트(NAS):컨테이너  — 외부 노출은 리버스 프록시에서 처리하므로
      # 필요시 127.0.0.1:3000 으로 묶어 사내 노출을 차단해도 됨.
      - "3000:3000"

    volumes:
      # TTS 캐시 — 컨테이너 재생성 시에도 보존
      - ./audio-cache:/app/public/audio

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
